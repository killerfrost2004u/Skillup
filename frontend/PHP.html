<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHP Course Player</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="course-player.css" />
    <script src="auth-guard.js"></script>
    <script>
      requireAuth();
    </script>
  </head>
  <body>
    <div class="background-overlay"></div>

    <a href="index.html" id="home-btn" class="home-btn" title="Go to Home"
      ><i class="fas fa-home"></i
    ></a>
    <button id="toggle-theme" class="neumorphic-btn">
      <i class="fas fa-moon"></i> Night Mode
    </button>

    <div class="course-container">
      <div class="video-section">
        <div class="progress-circle-container">
          <svg class="progress-circle" width="120" height="120">
            <circle
              cx="60"
              cy="60"
              r="54"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="12"
              fill="none"
            />
            <circle
              cx="60"
              cy="60"
              r="54"
              stroke="url(#grad)"
              stroke-width="12"
              fill="none"
              stroke-dasharray="339.292"
              stroke-dashoffset="339.292"
              stroke-linecap="round"
            />
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="var(--gd)" />
                <stop offset="100%" stop-color="var(--bu)" />
              </linearGradient>
            </defs>
          </svg>
          <span id="progress-text-circle">0%</span>
        </div>
        <div class="video-player">
          <div id="video-iframe"></div>
        </div>
        <div class="navigation">
          <button id="back-btn" class="neumorphic-btn">
            <i class="fas fa-chevron-left"></i> Back
          </button>
          <button id="next-btn" class="neumorphic-btn">
            Next <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="sidebar glassmorphic">
        <h2><i class="fas fa-list"></i> Course Lectures</h2>
        <ul id="lecture-list">
           <li class="lecture-item">Loading lectures...</li>
        </ul>
      </div>
    </div>

    <div id="completion-modal" class="modal">
      <div class="modal-content">
        <h3>Congratulations! 🎉</h3>
        <p>You've completed the entire course!</p>
        <div class="modal-buttons">
          <button onclick="window.location.href='trackD.html'" class="modal-btn">
            Back to Tracks
          </button>
          <button onclick="window.location.href='index.html'" class="modal-btn">Go Home</button>
        </div>
      </div>
    </div>

    <script>
      const API_KEY = "AIzaSyBwL2DIVb53ZGjtBdmQ0hjj9UG3I2e-XGo";
      const PLAYLIST_ID = "PLDoPjvoNmBAy41u35AqJUrI-H83DObUDq&si=MOMj3ejqe3CRpWYf";
    </script>
    <script src="course-player.js"></script>
  </body>
</html>
